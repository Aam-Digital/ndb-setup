# Shared helper for the /db/ proxy routes - contains NO server block.
#
# SWAG includes every proxy-confs/*.subdomain.conf at `http` level (see
# site-confs/default.conf), which is the only context `map` is allowed in, so
# this cannot live in resolver.conf or proxy.conf (both are also included
# inside server blocks) nor be repeated per instance file (a second definition
# of the same variable is a "duplicate map" error and nginx refuses to start).
#
# Why this exists at all:
# The /db/ routes need a dynamic upstream (`$subdomain-db-entrypoint`), and as
# soon as proxy_pass contains a variable, nginx no longer does its own
# location-prefix replacement - the target URI has to be built by hand. Building
# it from a regex location's capture ($1) silently corrupts the request, because
# that capture holds the *decoded* URI and nginx does not re-encode it:
#
#   GET /db/app/User%3AJane%20Doe   ->   GET /app/User:Jane Doe
#
# The raw space makes the upstream request line malformed, so the upstream's
# HTTP parser answers 400 and the document can never be fetched. This hit every
# entity whose id contains a space (legacy username-based `User:` ids).
#
# $request_uri is the raw, still-encoded request URI, so stripping the prefix
# from it keeps every escape intact - and, unlike a regex capture, a map result
# is substituted into proxy_pass without being escaped a second time.
#
# The captured value keeps the query string (it is part of $request_uri), so the
# proxy_pass lines must NOT append `?$args`.
#
# `[^\s]` rather than `.`: whitespace in the forwarded URI is the exact defect
# this guards against, so a URI containing any is not matched at all instead of
# being passed on and corrupting the upstream request line.
#
# The `default` deliberately yields an empty value: proxy_pass then forwards the
# original URI unchanged (prefix included), which fails visibly upstream instead
# of silently rewriting an unexpected request to the upstream root.
#
# Verified with nginx 1.29 (alpine) against these confs: `/db/app/User%3AJane%20Doe`
# reaches the upstream as `/app/User%3AJane%20Doe` (previously 400), encoded
# slashes (`%2F`) and literal percents (`%2520`) survive unchanged, query strings
# are passed through, and `/db/couchdb/...` still maps to `/couchdb/...`.

map $request_uri $db_uri {
    ~^/db(/[^\s]*)$          $1;
    default                  "";
}

map $request_uri $db_couchdb_uri {
    ~^/db/couchdb(/[^\s]*)$  /couchdb$1;
    default                  "";
}
