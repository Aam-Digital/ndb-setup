server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ~^(?<subdomain>.+)\.aam-digital\.com$;

    include /config/nginx/ssl.conf;
    include /config/nginx/proxy.conf;
    include /config/nginx/resolver.conf;

    gzip on;
    gzip_types text/plain application/x-javascript text/xml text/css;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;

    client_max_body_size 25M;

    # forward everything to the app container. Its own nginx now routes /db,
    # /db/couchdb and /api internally (ndb-core#4372), so this proxy no
    # longer needs per-path routing to the other instance containers, or the
    # raw-URI-preserving map those routes used to require (see the removed
    # aam-db-uri-map.subdomain.conf).
    location / {
        set $upstream_app "${subdomain}-app";
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
